{% extends 'base.html' %}
{% block title %}Log in · Prioritise{% endblock %}
{% block content %}
<main class="auth">
    <div class="auth-card">
        <div class="brand"><span class="logo">{% include 'icon.html' with name='check' %}</span>Prioritise</div>
        <h1>Welcome back</h1>
        <p class="muted">Log in to see what matters today.</p>
        <form method="post">
            {% csrf_token %}
            <label class="field"><span>Username</span>
                <input class="input" type="text" name="fnm" required autofocus></label>
            <label class="field"><span>Password</span>
                <input class="input" type="password" name="pwd" required></label>
            <button class="btn block" type="submit">Log in</button>
        </form>
        <p class="auth-footer">New here? <a href="{% url 'signup' %}">Create an account</a></p>
    </div>
</main>
{% endblock %}
